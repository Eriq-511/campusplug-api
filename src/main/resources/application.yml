server:
  port: ${PORT:8080}

spring:
  application:
    name: campusplug-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusplug}
    username: ${SPRING_DATASOURCE_USERNAME:campusplug}
    password: ${SPRING_DATASOURCE_PASSWORD:campusplug}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  cache:
    type: redis

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
    test-connection: false

app:
  auth:
    allowed-email-domains: ${APP_AUTH_ALLOWED_EMAIL_DOMAINS:must.ac.ug,std.must.ac.ug}
    jwt:
      secret: ${JWT_SECRET:dev-secret-change-me}
      ttl-seconds: ${APP_JWT_TTL_SECONDS:2592000}
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
    otp-enabled: ${APP_OTP_ENABLED:false}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  google:
    maps-api-key: ${GOOGLE_MAPS_API_KEY:}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  email:
    from: ${GMAIL_USER:noreply@campusplug.local}
    enabled: ${APP_EMAIL_ENABLED:false}

  cache:
    key-prefix: ${APP_CACHE_KEY_PREFIX:campusplug:cache:}
    categories-ttl-seconds: ${APP_CACHE_CATEGORIES_TTL_SECONDS:900}
    search-ttl-seconds: ${APP_CACHE_SEARCH_TTL_SECONDS:30}
    nearby-ttl-seconds: ${APP_CACHE_NEARBY_TTL_SECONDS:30}

management:
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info
