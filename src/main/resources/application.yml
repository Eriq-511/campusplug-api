server:
  port: ${PORT:8080}

spring:
  application:
    name: campusplug-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusplug}
    username: ${SPRING_DATASOURCE_USERNAME:campusplug}
    password: ${SPRING_DATASOURCE_PASSWORD:campusplug}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info
