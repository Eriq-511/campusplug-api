name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts are executable
        shell: bash
        run: |
          chmod +x mvnw
          if compgen -G "scripts/*.sh" > /dev/null; then chmod +x scripts/*.sh; fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: bash ./mvnw -q test

      - name: Phase gate (checklist vs reflector)
        shell: pwsh
        run: pwsh -File ./scripts/phase-gate.ps1 -CI
