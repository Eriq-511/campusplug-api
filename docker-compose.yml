services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusplug-api
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/campusplug
      SPRING_DATASOURCE_USERNAME: campusplug
      SPRING_DATASOURCE_PASSWORD: campusplug
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      APP_OTP_ENABLED: "true"
      APP_EMAIL_ENABLED: "true"
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    container_name: campusplug-postgis
    environment:
      POSTGRES_DB: campusplug
      POSTGRES_USER: campusplug
      POSTGRES_PASSWORD: campusplug
    ports:
      - "5432:5432"
    volumes:
      - campusplug_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusplug -d campusplug"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: campusplug-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: campusplug-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  campusplug_db:
