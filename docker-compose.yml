services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusplug-api
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/campusplug
      SPRING_DATASOURCE_USERNAME: campusplug
      SPRING_DATASOURCE_PASSWORD: campusplug
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    container_name: campusplug-postgis
    environment:
      POSTGRES_DB: campusplug
      POSTGRES_USER: campusplug
      POSTGRES_PASSWORD: campusplug
    ports:
      - "5432:5432"
    volumes:
      - campusplug_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusplug -d campusplug"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: campusplug-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  campusplug_db:
